spring:
  application:
    name: spring-boot-starter-smart-mybatis-example
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:smart_mybatis_example;MODE=MySQL;DATABASE_TO_UPPER=true;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  mybatis:
    smart:
      naming-convention: underline_upper
      table-prefix: sm_
      auto-sync-db: true
logging:
  file:
    name: logs/spring-boot-starter-smart-mybatis-example.log
  level:
    ink.icoding.smartmybatis.example.mapper: debug
